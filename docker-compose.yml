version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: brm-postgres
    environment:
      POSTGRES_USER: brm_user
      POSTGRES_PASSWORD: brm_password
      POSTGRES_DB: brm_database
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - brm-network

  flyway:
    image: flyway/flyway:11.11.1
    container_name: brm-flyway
    depends_on:
      - postgres
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/brm_database
      - FLYWAY_USER=brm_user
      - FLYWAY_PASSWORD=brm_password
      - FLYWAY_SCHEMAS=public
      - FLYWAY_CONNECT_RETRIES=60
      - FLYWAY_CONNECT_RETRIES_INTERVAL=1
    volumes:
      - ./db/migrations:/flyway/sql
      - ./flyway.conf:/flyway/conf/flyway.conf
    networks:
      - brm-network
    profiles:
      - migration

volumes:
  postgres_data:
    driver: local

networks:
  brm-network:
    driver: bridge