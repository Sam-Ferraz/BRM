version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: brm-postgres
    environment:
      POSTGRES_USER: brm_user
      POSTGRES_PASSWORD: brm_password
      POSTGRES_DB: brm_database
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - brm-network

  flyway:
    image: flyway/flyway:11.11.1
    container_name: brm-flyway
    depends_on:
      - postgres
    environment:
      - FLYWAY_URL=jdbc:postgresql://postgres:5432/brm_database
      - FLYWAY_USER=brm_user
      - FLYWAY_PASSWORD=brm_password
      - FLYWAY_SCHEMAS=public
      - FLYWAY_CONNECT_RETRIES=60
      - FLYWAY_CONNECT_RETRIES_INTERVAL=1
    volumes:
      - ./db/migrations:/flyway/sql
      - ./flyway.conf:/flyway/conf/flyway.conf
    networks:
      - brm-network
    profiles:
      - migration

  # MinIO service for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: brm-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - brm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket creation service
  minio-buckets:
    image: minio/mc:latest
    container_name: brm-minio-buckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_minio: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc ready minio; do sleep 1; done;
      echo 'Creating bucket sa1-brm-data...';
      mc mb minio/sa1-brm-data --ignore-existing;
      echo 'Setting bucket policy...';
      mc anonymous set none minio/sa1-brm-data;
      echo 'MinIO setup complete!';
      "
    networks:
      - brm-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  brm-network:
    driver: bridge