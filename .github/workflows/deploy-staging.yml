name: Deploy to Staging

# Dispara automaticamente em todo push para a branch `trunk`.
# Deploya em test.brm.tec.br.
on:
  push:
    branches:
      - trunk

# Evita rodar 2 deploys simultâneos pra staging (segura o mais novo, cancela em andamento).
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 → traz histórico completo + tags pra conseguir calcular
      # quantos commits estão adiantados em relação à última tag prod-*.
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mostra quantos commits estão adiantados em relação a prod
        run: |
          echo "::group::📦 Delta staging vs prod"
          LAST_PROD_TAG=$(git tag --sort=-creatordate -l "prod-*" | head -1)
          if [ -n "$LAST_PROD_TAG" ]; then
            COUNT=$(git rev-list --count "$LAST_PROD_TAG..HEAD" 2>/dev/null || echo "?")
            if [ "$COUNT" = "0" ]; then
              echo "✅ Staging está IGUAL a prod ($LAST_PROD_TAG). Nada pendente."
            else
              echo "🚀 Staging tem $COUNT commit(s) NOVOS em relação a $LAST_PROD_TAG:"
              echo ""
              git log --pretty=format:'  • %h  %s%n     %an, %ar' "$LAST_PROD_TAG..HEAD"
              echo ""
              echo ""
              echo "::notice title=🚀 $COUNT commit(s) aguardando prod::Rode 'Deploy to Production' quando estiver pronto."
            fi
          else
            echo "📌 Nenhuma tag prod-* ainda — primeiro deploy pra prod pendente."
          fi
          echo "::endgroup::"

      - name: Decodifica chave privada (base64) e configura agente SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Adiciona host ao known_hosts (evita prompt de fingerprint)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sincroniza API keys no .env do servidor
        # Injeta ANTHROPIC_API_KEY e OPENAI_API_KEY no .env antes do deploy
        # rodar, pra o backend subir ja com as chaves disponiveis. Procura o
        # .env em paths comuns, faz backup e substitui linhas existentes de
        # forma atomica (grep -v + append + mv). Secrets nao definidos no
        # GitHub sao ignorados (nao removem linhas existentes no .env).
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash <<EOF
          set -e
          ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}'
          OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
          ENV_FILE=""
          for candidate in /opt/brm/staging/.env /opt/brm/.env /opt/brm/current/.env /srv/brm/.env /home/brm/.env; do
            if [ -f "\$candidate" ]; then
              ENV_FILE="\$candidate"
              break
            fi
          done
          if [ -z "\$ENV_FILE" ]; then
            echo "ERRO: .env nao encontrado em paths conhecidos" >&2
            exit 1
          fi
          echo "Atualizando \$ENV_FILE"
          cp "\$ENV_FILE" "\$ENV_FILE.bak.\$(date +%s)"
          TMP="\$ENV_FILE.tmp.\$\$"
          grep -vE '^(ANTHROPIC_API_KEY|OPENAI_API_KEY)=' "\$ENV_FILE" > "\$TMP" || true
          if [ -n "\$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=\$ANTHROPIC_API_KEY" >> "\$TMP"
          fi
          if [ -n "\$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY=\$OPENAI_API_KEY" >> "\$TMP"
          fi
          mv "\$TMP" "\$ENV_FILE"
          echo "OK"
          EOF

      - name: Roda deploy remoto (staging) puxando trunk atualizado
        run: |
          # SHA do commit que disparou: ${{ github.sha }}
          # O script puxa a branch trunk, que neste momento tem esse SHA como HEAD.
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "/opt/brm/deploy.sh staging trunk"

      - name: Smoke test no endpoint público
        run: |
          # Aguarda alguns segundos pro app estabilizar pós-restart
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://test.brm.tec.br/health)
          echo "GET https://test.brm.tec.br/health → HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "❌ Smoke test falhou (esperado 200, recebeu $HTTP)"
            exit 1
          fi
          echo "✅ Staging respondendo OK"
