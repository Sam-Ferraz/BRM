name: Deploy BRM Application

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: sa-east-1
  APP_NAME: brm-app
  ENVIRONMENT: production
  ECR_REPOSITORY: 062721086100.dkr.ecr.sa-east-1.amazonaws.com/brm-app-production

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      application: ${{ steps.changes.outputs.application }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          # Check if CloudFormation template changed
          if git diff HEAD~1 HEAD --name-only | grep -E '^cloudformation/.*\.yaml$'; then
            echo "infrastructure=true" >> $GITHUB_OUTPUT
          else
            echo "infrastructure=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if application code changed (or force deploy on any push to trunk)
          if git diff HEAD~1 HEAD --name-only | grep -E '^(src/|server/|package\.json|Dockerfile)' || echo "Force deploy on trunk"; then
            echo "application=true" >> $GITHUB_OUTPUT
          else
            echo "application=false" >> $GITHUB_OUTPUT
          fi

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure == 'true'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names brm-app-production --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name brm-app-production --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true
          
          # Set lifecycle policy
          aws ecr put-lifecycle-policy --repository-name brm-app-production --region ${{ env.AWS_REGION }} \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Keep last 5 images","selection":{"tagStatus":"tagged","tagPrefixList":["latest"],"countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/infrastructure.yaml \
            --stack-name ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              AppName=${{ env.APP_NAME }} \
              Environment=${{ env.ENVIRONMENT }} \
              ImageTag=latest \
              ECRRepositoryURI=${{ env.ECR_REPOSITORY }} \
              DBHost=${{ vars.DB_HOST }} \
              DBPort=${{ vars.DB_PORT }} \
              DBName=${{ vars.DB_NAME }} \
              DBUser=${{ vars.DB_USER }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              JWTSecret=${{ secrets.JWT_SECRET }} \
              JWTExpiresIn=${{ vars.JWT_EXPIRES_IN }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Wait for stack deployment
        run: |
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }}

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-infrastructure]
    if: always() && needs.detect-changes.outputs.application == 'true' && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names brm-app-production --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository --repository-name brm-app-production --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          # Build image
          docker build -t ${{ env.APP_NAME }}:latest .
          
          # Tag for ECR
          docker tag ${{ env.APP_NAME }}:latest ${{ env.ECR_REPOSITORY }}:latest
          docker tag ${{ env.APP_NAME }}:latest ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          
          # Push both tags
          docker push ${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-cluster \
            --service ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-cluster \
            --services ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }}-service \
            --region ${{ env.AWS_REGION }}

      - name: Get application URL
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerURL`].OutputValue' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "🚀 Application deployed successfully!"
          echo "📱 URL: $URL"
          echo "🔍 Health: $URL/health"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-infrastructure, deploy-application]
    if: always()
    steps:
      - name: Configure AWS credentials
        if: needs.deploy-application.result == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Action |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.deploy-infrastructure.result || 'skipped' }} | ${{ needs.detect-changes.outputs.infrastructure == 'true' && 'Updated' || 'No changes' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ needs.deploy-application.result || 'skipped' }} | ${{ needs.detect-changes.outputs.application == 'true' && 'Deployed' || 'No changes' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy-application.result }}" == "success" ]]; then
            URL=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.APP_NAME }}-${{ env.ENVIRONMENT }} \
              --query 'Stacks[0].Outputs[?OutputKey==`LoadBalancerURL`].OutputValue' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Application successfully deployed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Quick Links:**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Application: $URL" >> $GITHUB_STEP_SUMMARY
            echo "- 🏥 Health Check: $URL/health" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 Region: sa-east-1 (São Paulo)" >> $GITHUB_STEP_SUMMARY
          fi