name: Database Migration

on:
  push:
    branches: [ main, trunk ]
    paths:
      - 'db/migrations/**'
      - '.github/workflows/database.yml'
  pull_request:
    branches: [ main, trunk ]
    paths:
      - 'db/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Deploy Migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/trunk'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to production database
      run: |
        docker run --rm \
          -e DB_HOST=${{ vars.DB_HOST }} \
          -e DB_PORT=${{ vars.DB_PORT }} \
          -e DB_NAME=${{ vars.DB_NAME }} \
          -e DB_USER=${{ vars.DB_USER }} \
          -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          -v ${{ github.workspace }}/db/migrations:/flyway/sql \
          -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
          flyway/flyway:11.11.1 migrate