name: Deploy to Production

# Dispara MANUALMENTE pelo botão "Run workflow" na aba Actions.
# Deploya em brm.tec.br.
#
# Fluxo recomendado:
#   1. Push para trunk → auto-deploya staging
#   2. Testa em https://test.brm.tec.br
#   3. Vai em Actions → "Deploy to Production" → "Run workflow"
#      (não precisa digitar nada — o environment 'production' bloqueia o
#      job até receber aprovação. Você recebe email/push do GitHub com 1
#      clique pra aprovar — funciona com Face ID no GitHub mobile.)
#
# Setup do environment (UNICA VEZ via UI do GitHub):
#   Settings → Environments → New environment → "production"
#   → Required reviewers → adiciona seu user → Save
#
# Recursos:
#   • Lista os commits que serão promovidos no início do log
#   • Cria tag git "prod-YYYYMMDDHHMMSS" após deploy bem-sucedido
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag ou SHA a promover (default: trunk)'
        required: false
        default: 'trunk'
        type: string

# Evita rodar 2 deploys simultâneos pra prod (segura o primeiro, falha o segundo).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Permissão necessária pra criar a tag de release no final.
permissions:
  contents: write

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    # Required reviewers do environment 'production' aprovam antes do job rodar.
    environment:
      name: production
      url: https://brm.tec.br
    steps:
      # fetch-depth: 0 → traz histórico completo + todas as tags pra conseguirmos
      # comparar com a última tag prod-* e listar os commits do lote.
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Lista commits que serão promovidos pra produção
        run: |
          echo "::group::📦 Lote a promover"
          LAST_PROD_TAG=$(git tag --sort=-creatordate -l "prod-*" | head -1)
          if [ -n "$LAST_PROD_TAG" ]; then
            COUNT=$(git rev-list --count "$LAST_PROD_TAG..HEAD" 2>/dev/null || echo "?")
            echo "📌 Última promoção pra prod: $LAST_PROD_TAG"
            echo "📊 Commits novos no lote: $COUNT"
            echo ""
            echo "Commits que serão deployados:"
            echo "──────────────────────────────────────────────"
            git log --pretty=format:'  • %h  %s%n     %an, %ar' "$LAST_PROD_TAG..HEAD" || \
              echo "  (nenhum commit novo desde $LAST_PROD_TAG — vai promover o mesmo código)"
            echo ""
            echo "──────────────────────────────────────────────"
          else
            echo "📌 Primeiro deploy oficial pra produção."
            echo ""
            echo "Últimos 15 commits no ref:"
            echo "──────────────────────────────────────────────"
            git log --pretty=format:'  • %h  %s%n     %an, %ar' -15
            echo ""
            echo "──────────────────────────────────────────────"
          fi
          echo "::endgroup::"

      - name: Decodifica chave privada (base64) e configura agente SSH
        env:
          SSH_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Adiciona host ao known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Roda deploy remoto (prod) pelo ref informado
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "/opt/brm/deploy.sh prod ${{ github.event.inputs.ref }}"

      - name: Smoke test no endpoint público
        run: |
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://brm.tec.br/health)
          echo "GET https://brm.tec.br/health → HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "❌ Smoke test falhou (esperado 200, recebeu $HTTP)"
            exit 1
          fi
          echo "✅ Produção respondendo OK"

      # Cria tag git "prod-YYYYMMDDHHMMSS" SOMENTE se tudo passou.
      # Assim você tem rastro do que foi pra prod e quando, e no próximo
      # deploy o step "Lista commits" usa essa tag pra mostrar o delta.
      - name: Cria tag prod-{timestamp} e empurra pro GitHub
        if: success()
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          TAG="prod-$TS"
          SHA=$(git rev-parse --short HEAD)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Deploy to production em $(date -u +%FT%TZ) — HEAD=$SHA"
          git push origin "$TAG"

          echo "::notice title=🏷️ Tag criada::$TAG marca este deploy (HEAD=$SHA)"
          echo ""
          echo "🏷️  Tag $TAG criada e empurrada com sucesso."
          echo "    Pra ver o que cada deploy de prod levou:"
          echo "      git tag --sort=-creatordate -l 'prod-*'"
          echo "      git log <tag1>..<tag2> --oneline"
