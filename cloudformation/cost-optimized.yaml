AWSTemplateFormatVersion: '2010-09-09'
Description: 'BRM Application - Cost-optimized with existing RDS integration and scheduled scaling'

Parameters:
  AppName:
    Type: String
    Default: brm-app
    Description: Name of the application
  
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]
    Description: Environment name
  
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  
  ECRRepositoryURI:
    Type: String
    Default: 062721086100.dkr.ecr.sa-east-1.amazonaws.com/brm-app-production
    Description: ECR repository URI (created manually)
  
  JWTSecret:
    Type: String
    NoEcho: true
    Default: changeme-jwt-secret
    Description: JWT secret for authentication
  
  JWTExpiresIn:
    Type: String
    Default: 7d
    Description: JWT expiration time
  
  DBHost:
    Type: String
    Default: brm-dev.clgci46a88lk.sa-east-1.rds.amazonaws.com
    Description: Database host (existing RDS instance)
  
  DBPort:
    Type: String
    Default: '5432'
    Description: Database port
  
  DBName:
    Type: String
    Default: brm_db
    Description: Database name
  
  DBUser:
    Type: String
    Default: postgres
    Description: Database username
  
  DBPassword:
    Type: String
    NoEcho: true
    Default: changeme123
    Description: Database password

  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['128', '256', '512', '1024']
    Description: 'CPU units for the task (128=0.125 vCPU, 256=0.25 vCPU, 512=0.5 vCPU, 1024=1 vCPU)'
    
  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: 'Memory in MB for the task'

  # Scheduling parameters
  EnableScheduling:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable/disable scheduled scaling (saves ~65% on compute costs)

  ScaleDownTime:
    Type: String
    Default: 'cron(0 2 * * ? *)'
    Description: 'Cron expression for scaling down (default: 2:00 AM UTC)'

  ScaleUpTime:
    Type: String
    Default: 'cron(0 12 * * ? *)'
    Description: 'Cron expression for scaling up (default: 12:00 PM UTC)'

  EnableRDSScheduling:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable/disable RDS scheduled start/stop (saves ~65% on RDS costs)

Conditions:
  SchedulingEnabled: !Equals [!Ref EnableScheduling, 'true']
  RDSSchedulingEnabled: !Equals [!Ref EnableRDSScheduling, 'true']

Resources:
  # VPC and Networking (minimal setup for cost optimization)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-vpc
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Single public subnet for cost optimization
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-public-subnet-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-public-routes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # Security Groups
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-alb-sg

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3002
          ToPort: 3002
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-ecs-sg

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AppName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-tg
      Port: 3002
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-tg

  LoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Cluster with Spot instances for maximum cost savings
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-${Environment}-cluster
      CapacityProviders:
        - FARGATE_SPOT  # Use Spot for maximum cost savings
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 100
      ClusterSettings:
        - Name: containerInsights
          Value: disabled  # Disable to save costs
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-cluster

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-task-execution-role

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource: !Sub "${BrmDataBucket}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Ref BrmDataBucket
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-task-role

  # S3 Bucket for product images and data
  BrmDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-${Environment}-data-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: NonCurrentVersionExpiration
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-${Environment}-data"
        - Key: Environment
          Value: !Ref Environment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # CloudWatch Log Group (short retention for cost savings)
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AppName}-${Environment}
      RetentionInDays: 3  # Minimal retention for cost savings
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-logs

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-${Environment}
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub ${AppName}-container
          Image: !Sub ${ECRRepositoryURI}:${ImageTag}
          PortMappings:
            - ContainerPort: 3002
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3002'
            - Name: DB_HOST
              Value: !Ref DBHost
            - Name: DB_PORT
              Value: !Ref DBPort
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: !Ref DBUser
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: JWT_SECRET
              Value: !Ref JWTSecret
            - Name: JWT_EXPIRES_IN
              Value: !Ref JWTExpiresIn
            - Name: CLIENT_URL
              Value: !Sub http://${ApplicationLoadBalancer.DNSName}
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_S3_BUCKET
              Value: !Ref BrmDataBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Essential: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'curl -f http://localhost:3002/health || exit 1'
            Interval: 10
            Timeout: 3
            Retries: 2
            StartPeriod: 30
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-task-definition

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: LoadBalancerListener
    Properties:
      ServiceName: !Sub ${AppName}-${Environment}-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1  # Single instance for cost optimization
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: !Sub ${AppName}-container
          ContainerPort: 3002
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-service

  # Cost Optimization: Scheduled Scaling (Conditional)
  ScalingLambda:
    Type: AWS::Lambda::Function
    Condition: SchedulingEnabled
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-scaling-function"
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt ScalingLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          
          def lambda_handler(event, context):
              ecs_client = boto3.client('ecs')
              
              cluster_name = event['cluster']
              service_name = event['service'] 
              desired_count = event['desiredCount']
              
              try:
                  response = ecs_client.update_service(
                      cluster=cluster_name,
                      service=service_name,
                      desiredCount=desired_count
                  )
                  
                  print(f"Successfully scaled {service_name} to {desired_count} tasks")
                  return {
                      'statusCode': 200,
                      'body': json.dumps(f'Service scaled to {desired_count}')
                  }
              except Exception as e:
                  print(f"Error scaling service: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps(f'Error: {str(e)}')
                  }
      Timeout: 60
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-scaling-function

  ScalingLambdaRole:
    Type: AWS::IAM::Role
    Condition: SchedulingEnabled
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-scaling-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ECSScalingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSCluster}/${ECSService}"
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-scaling-lambda-role

  # Scale down rule
  ScaleDownRule:
    Type: AWS::Events::Rule
    Condition: SchedulingEnabled
    Properties:
      Name: !Sub "${AppName}-${Environment}-scale-down"
      Description: "Scale down ECS service at night to save costs"
      ScheduleExpression: !Ref ScaleDownTime
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScalingLambda.Arn
          Id: ScaleDownTarget
          Input: !Sub |
            {
              "cluster": "${ECSCluster}",
              "service": "${ECSService}",
              "desiredCount": 0
            }

  # Scale up rule
  ScaleUpRule:
    Type: AWS::Events::Rule
    Condition: SchedulingEnabled
    Properties:
      Name: !Sub "${AppName}-${Environment}-scale-up"
      Description: "Scale up ECS service in the morning"
      ScheduleExpression: !Ref ScaleUpTime
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScalingLambda.Arn
          Id: ScaleUpTarget
          Input: !Sub |
            {
              "cluster": "${ECSCluster}",
              "service": "${ECSService}",
              "desiredCount": 1
            }

  # Lambda permissions
  ScalingLambdaPermissionDown:
    Type: AWS::Lambda::Permission
    Condition: SchedulingEnabled
    Properties:
      FunctionName: !Ref ScalingLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScaleDownRule.Arn

  ScalingLambdaPermissionUp:
    Type: AWS::Lambda::Permission
    Condition: SchedulingEnabled
    Properties:
      FunctionName: !Ref ScalingLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScaleUpRule.Arn

  # RDS Scheduling (Conditional)
  RDSSchedulingLambda:
    Type: AWS::Lambda::Function
    Condition: RDSSchedulingEnabled
    Properties:
      FunctionName: !Sub "${AppName}-${Environment}-rds-scheduling"
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt RDSSchedulingLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          
          def lambda_handler(event, context):
              rds_client = boto3.client('rds')
              
              db_identifier = event['dbIdentifier']
              action = event['action']  # 'start' or 'stop'
              
              try:
                  if action == 'stop':
                      response = rds_client.stop_db_instance(
                          DBInstanceIdentifier=db_identifier
                      )
                      message = f'Successfully stopped RDS instance {db_identifier}'
                  elif action == 'start':
                      response = rds_client.start_db_instance(
                          DBInstanceIdentifier=db_identifier
                      )
                      message = f'Successfully started RDS instance {db_identifier}'
                  else:
                      raise ValueError(f'Invalid action: {action}')
                  
                  print(message)
                  return {
                      'statusCode': 200,
                      'body': json.dumps(message)
                  }
              except Exception as e:
                  error_msg = f"Error {action}ing RDS instance: {str(e)}"
                  print(error_msg)
                  return {
                      'statusCode': 500,
                      'body': json.dumps(error_msg)
                  }
      Timeout: 60
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-rds-scheduling

  RDSSchedulingLambdaRole:
    Type: AWS::IAM::Role
    Condition: RDSSchedulingEnabled
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-rds-scheduling-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RDSSchedulingPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds:StopDBInstance
                  - rds:StartDBInstance
                  - rds:DescribeDBInstances
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:brm-dev"
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-rds-scheduling-lambda-role

  # Stop RDS at night
  RDSStopRule:
    Type: AWS::Events::Rule
    Condition: RDSSchedulingEnabled
    Properties:
      Name: !Sub "${AppName}-${Environment}-rds-stop"
      Description: "Stop RDS instance at night to save costs"
      ScheduleExpression: "cron(0 2 * * ? *)"  # 2:00 AM UTC
      State: ENABLED
      Targets:
        - Arn: !GetAtt RDSSchedulingLambda.Arn
          Id: RDSStopTarget
          Input: |
            {
              "dbIdentifier": "brm-dev",
              "action": "stop"
            }

  # Start RDS in the morning
  RDSStartRule:
    Type: AWS::Events::Rule
    Condition: RDSSchedulingEnabled
    Properties:
      Name: !Sub "${AppName}-${Environment}-rds-start"
      Description: "Start RDS instance in the morning"
      ScheduleExpression: "cron(55 11 * * ? *)"  # 11:55 AM UTC (5 min before ECS)
      State: ENABLED
      Targets:
        - Arn: !GetAtt RDSSchedulingLambda.Arn
          Id: RDSStartTarget
          Input: |
            {
              "dbIdentifier": "brm-dev",
              "action": "start"
            }

  # Lambda permissions for RDS scheduling
  RDSLambdaPermissionStop:
    Type: AWS::Lambda::Permission
    Condition: RDSSchedulingEnabled
    Properties:
      FunctionName: !Ref RDSSchedulingLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RDSStopRule.Arn

  RDSLambdaPermissionStart:
    Type: AWS::Lambda::Permission
    Condition: RDSSchedulingEnabled
    Properties:
      FunctionName: !Ref RDSSchedulingLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RDSStartRule.Arn

Outputs:
  LoadBalancerURL:
    Description: URL of the Application Load Balancer
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}
    Export:
      Name: !Sub ${AppName}-${Environment}-LoadBalancerURL

  ECRRepositoryURI:
    Description: URI of the ECR repository
    Value: !Sub ${ECRRepositoryURI}:${ImageTag}
    Export:
      Name: !Sub ${AppName}-${Environment}-ECRRepositoryURI

  ECSClusterName:
    Description: Name of the ECS cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${AppName}-${Environment}-ECSClusterName

  ECSServiceName:
    Description: Name of the ECS service
    Value: !Ref ECSService
    Export:
      Name: !Sub ${AppName}-${Environment}-ECSServiceName

  BrmDataBucket:
    Description: S3 Bucket for product images and data
    Value: !Ref BrmDataBucket
    Export:
      Name: !Sub ${AppName}-${Environment}-BrmDataBucket

  DatabaseEndpoint:
    Description: RDS PostgreSQL Database Endpoint (existing instance)
    Value: !Ref DBHost
    Export:
      Name: !Sub ${AppName}-${Environment}-DatabaseEndpoint

  DatabasePort:
    Description: RDS PostgreSQL Database Port (existing instance)
    Value: !Ref DBPort
    Export:
      Name: !Sub ${AppName}-${Environment}-DatabasePort

  CostSavingsEnabled:
    Description: Whether cost optimization features are enabled
    Value: !Sub 'ECS Scheduling: ${EnableScheduling}, RDS Scheduling: ${EnableRDSScheduling}'

  EstimatedMonthlySavings:
    Description: Estimated monthly cost savings
    Value: 'ECS: ~$20/month (65% of compute), RDS: ~$8/month (65% of DB costs)'