<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/placeholder-logo.svg" />
    <link rel="apple-touch-icon" href="/placeholder-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Cor da barra de status e tema em cada modo -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />

    <!-- iOS: comportamento de app quando adicionado à tela inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BRM" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>BRM</title>
    <meta name="description" content="Sistema de gestão de negócios imobiliários" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registra service worker (só em produção; dev fica sem)
      if ('serviceWorker' in navigator && !/localhost|127\.0\.0\.1/.test(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[SW] Falha ao registrar:', err)
          })
        })
      }
    </script>
  </body>
</html>
