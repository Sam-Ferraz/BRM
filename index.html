<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/placeholder-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRM</title>
    <meta name="description" content="Sistema completo de gestão empresarial com CRM, vendas e produtos" />

    <!-- ============================================================
         KILL SWITCH AGRESSIVO — desregistra Service Worker + bloqueia
         carregamento do React até estar limpo.
         ------------------------------------------------------------
         Estratégia:
         1. Se detecta um SW ativo controlando a página, PARA todos os
            fetches em andamento (window.stop()) — impede que o SW velho
            processe requests do bundle e trave a página em branco.
         2. Faz unregister + caches.delete em paralelo.
         3. Recarrega. Flag localStorage impede loop.

         Marca de auxílio: quando o script conclui com sucesso, define
         window.__brm_sw_killed = true — assim o main.tsx só monta React
         quando o SW foi limpo (ou nunca existiu).
         ============================================================ -->
    <script>
      (function () {
        var STORAGE_KEY = 'brm-sw-killed-v2'
        try {
          // Já limpou antes — deixa passar
          if (localStorage.getItem(STORAGE_KEY) === 'yes') {
            window.__brm_sw_ready = true
            return
          }

          var hasActiveSW = 'serviceWorker' in navigator && navigator.serviceWorker.controller
          var hasCaches = !!window.caches

          if (!hasActiveSW && !hasCaches) {
            // Nada pra fazer
            localStorage.setItem(STORAGE_KEY, 'yes')
            window.__brm_sw_ready = true
            return
          }

          // Tem SW ativo OU caches — precisa limpar antes de deixar React carregar.
          // Bloqueia todos os fetches em andamento pra evitar tela em branco eterna.
          try { window.stop() } catch (e) {}

          document.write(
            '<style>' +
            'body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
            'background:#fff;color:#0c343d;display:flex;align-items:center;justify-content:center;' +
            'min-height:100vh;text-align:center;padding:20px;}' +
            '.brm-boot{max-width:400px}' +
            '.brm-boot h1{font-size:24px;margin-bottom:8px;color:#0c343d}' +
            '.brm-boot p{color:#666;font-size:14px;margin:4px 0}' +
            '.brm-boot-spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#0c343d;' +
            'border-radius:50%;animation:brm-spin 0.8s linear infinite;margin:16px auto}' +
            '@keyframes brm-spin{to{transform:rotate(360deg)}}' +
            '</style>'
          )

          var promises = []
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister() }))
              }).catch(function () {})
            )
          }
          if (hasCaches) {
            promises.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              }).catch(function () {})
            )
          }

          Promise.all(promises).then(function () {
            localStorage.setItem(STORAGE_KEY, 'yes')
            location.reload()
          })
        } catch (e) {
          console.warn('[sw-kill] failed:', e)
          window.__brm_sw_ready = true
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="brm-boot">
        <div class="brm-boot-spinner"></div>
        <h1>BRM</h1>
        <p>Preparando aplicativo...</p>
        <p style="font-size:11px;opacity:.6">Se demorar mais de 30 segundos, recarregue esta página.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
