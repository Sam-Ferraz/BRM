# /etc/nginx/sites-available/brm.tec.br
# Vhost da LANDING PAGE institucional (brm.tec.br).
#
# Serve arquivos estaticos de /var/www/brm-landing.
# Redireciona /app, /crm, /login, /dashboard pra app.brm.tec.br (ajuda SEO
# e nao quebra bookmarks antigos que apontavam pra URLs do produto).

server {
    listen 80;
    listen [::]:80;
    server_name brm.tec.br www.brm.tec.br;

    # Deixa o certbot renovar o cert por HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://brm.tec.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brm.tec.br www.brm.tec.br;

    ssl_certificate     /etc/letsencrypt/live/brm.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brm.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redireciona www -> brm.tec.br (sem www, padrao)
    if ($host = www.brm.tec.br) {
        return 301 https://brm.tec.br$request_uri;
    }

    root /var/www/brm-landing;
    index index.html;

    # URLs antigas do produto redirecionam pro subdominio novo.
    # Ajuda usuarios que tinham a URL no favorito.
    location = /login     { return 301 https://app.brm.tec.br/login; }
    location = /dashboard { return 301 https://app.brm.tec.br/dashboard; }
    location = /chat      { return 301 https://app.brm.tec.br/chat; }
    location = /negocios  { return 301 https://app.brm.tec.br/negocios; }
    location = /clientes  { return 301 https://app.brm.tec.br/clientes; }
    location /app         { return 301 https://app.brm.tec.br/; }
    location /crm         { return 301 https://app.brm.tec.br/; }

    # Landing: arquivos estaticos. Qualquer 404 cai no index.html (opcional —
    # se for SPA; pra site estatico multi-pagina, substitui por =404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pra assets estaticos (CSS/JS/imagens com hash no nome)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Impede indexacao de URLs tecnicas se a landing tiver alguma
    location ~ /\. { deny all; }

    # Security headers minimos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
