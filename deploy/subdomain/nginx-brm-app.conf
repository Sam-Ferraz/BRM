# /etc/nginx/sites-available/app.brm.tec.br
# Vhost do APP CRM (app.brm.tec.br).
#
# Serve o build do Vite em /opt/brm/prod/dist (SPA, fallback no index.html)
# e faz proxy_pass das rotas /api/* pro backend Node em 127.0.0.1:3001.

server {
    listen 80;
    listen [::]:80;
    server_name app.brm.tec.br;

    # Deixa o certbot renovar o cert por HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.brm.tec.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.brm.tec.br;

    # ---- SSL ----
    # O setup-subdomain.sh tenta emitir esses certs via certbot ANTES de
    # habilitar este vhost; se o certbot falhar o script aborta.
    ssl_certificate     /etc/letsencrypt/live/app.brm.tec.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.brm.tec.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload maximo (fotos de imovel, audio de WhatsApp)
    client_max_body_size 25m;

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE (Server-Sent Events) usado pelo /api/chat/events — precisa
        # desabilitar buffering e manter conexao aberta.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Uploads de midia (fotos de imovel e audio do chat) ----
    # Se o backend serve via /uploads ja (como static middleware), pode
    # remover este bloco. Se serve so via /api, este bloco serve direto do
    # disco (mais rapido que passar pelo Node).
    location /uploads/ {
        alias /opt/brm/prod/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Frontend SPA (Vite build) ----
    location / {
        root /opt/brm/prod/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pra assets com hash (Vite gera index-<hash>.js etc)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        root /opt/brm/prod/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
